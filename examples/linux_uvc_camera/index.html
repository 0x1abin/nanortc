<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanortc — USB Camera (adaptive)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #111; color: #ddd; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 1rem;
  }
  header {
    width: 100%; max-width: 1280px; display: flex;
    align-items: center; justify-content: space-between; margin-bottom: 0.75rem;
  }
  h1 { font-size: 1rem; font-weight: 500; color: #aaa; }
  #status {
    font-size: 0.85rem; padding: 4px 10px; border-radius: 4px;
    background: #222; color: #888; font-family: ui-monospace, Menlo, monospace;
  }
  #status.ok  { background: #1c3a1f; color: #6f6; }
  #status.err { background: #3a1c1c; color: #f66; }
  .video-wrap {
    width: 100%; max-width: 1280px; background: #000; border-radius: 6px;
    overflow: hidden; aspect-ratio: 16 / 9; display: flex;
    align-items: center; justify-content: center; position: relative;
  }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #stats {
    display: none;
    position: absolute; top: 10px; left: 10px;
    grid-template-columns: auto auto; gap: 2px 12px;
    background: rgba(0,0,0,0.62); backdrop-filter: blur(2px);
    font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem;
    padding: 9px 12px; border-radius: 6px; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.12); line-height: 1.5;
  }
  #stats .k { color: #8aa; }
  #stats .v { color: #7e7; text-align: right; font-variant-numeric: tabular-nums; }
  #stats .v.warn { color: #ec6; }
  #stats .v.bad { color: #f66; }
  .controls { margin-top: 0.75rem; display: flex; gap: 0.5rem; align-items: center; }
  button {
    background: #2a5; color: white; border: 0; padding: 8px 18px;
    border-radius: 4px; font-size: 0.9rem; cursor: pointer; font-weight: 500;
  }
  button:hover { background: #3b6; }
  button:disabled { background: #444; color: #888; cursor: default; }
  details { margin-top: 0.75rem; width: 100%; max-width: 1280px; }
  summary {
    cursor: pointer; padding: 6px 10px; background: #1a1a1a; border-radius: 4px;
    font-size: 0.8rem; color: #888; user-select: none;
  }
  #log {
    margin-top: 0.5rem; border: 1px solid #222; background: #0a0a0a; padding: 8px;
    height: 220px; overflow-y: auto; white-space: pre-wrap; font-size: 0.78rem;
    font-family: ui-monospace, Menlo, monospace; border-radius: 4px; color: #888;
  }
  #log .info { color: #888; }
  #log .ok   { color: #6c6; }
  #log .err  { color: #c66; }
  #log .warn { color: #cc6; }
</style>
</head>
<body>

<header>
  <h1>nanortc — USB Camera (adaptive bitrate)</h1>
  <span id="status">Idle</span>
</header>

<div class="video-wrap">
  <video id="remoteVideo" autoplay playsinline muted controls></video>
  <div id="stats"></div>
</div>

<div class="controls">
  <button id="btnConnect" onclick="start()">Start</button>
  <button id="btnStop" onclick="stop()" disabled>Stop</button>
</div>

<details open>
  <summary>Debug log</summary>
  <div id="log"></div>
</details>

<script>
// ----------------------------------------------------------------
// linux_uvc_camera browser viewer
//
// Connects as the WebRTC offerer to the nanortc host (the
// linux_uvc_camera process), receives a single recvonly H.265 (or
// H.264) video track and renders it. No audio, no DataChannel.
//
// H.265/HEVC RECEIVE SUPPORT:
//   nanortc is the answerer — it can only send H.265 if the browser
//   advertises HEVC in its OFFER. This requires:
//     - Safari (macOS/iOS): native HEVC, works out of the box.
//     - Chrome >= 136 on macOS/Windows with a hardware HEVC decoder.
//   On Start we scan the offer SDP and warn if no H265 line is present.
//   If you see that warning, either update Chrome / use Safari, or run
//   the host with `-e h264_nvenc` to fall back to H.264.
//
// ICE over Tailscale: we SKIP the browser's mDNS ".local" host
// candidates (they are useless cross-machine). Connectivity relies on
// the host's advertised Tailscale 100.x candidate plus peer-reflexive
// discovery of this browser's address from the inbound STUN check.
// ----------------------------------------------------------------

const SIG_BASE = location.origin;
let peerId = -1;
let pc = null;
let pollAbort = null;
let polling = false;

function log(cls, msg) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setStatus(cls, text) {
  const el = document.getElementById('status');
  el.className = cls;
  el.textContent = text;
}

// --- HTTP signaling ---

async function sigJoin() {
  const r = await fetch(SIG_BASE + '/join', {method: 'POST'});
  if (!r.ok) throw new Error('join HTTP ' + r.status);
  const j = await r.json();
  return j.id;
}

async function sigSend(msg) {
  await fetch(SIG_BASE + '/send?id=' + peerId, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(msg)
  });
}

async function sigRecv(timeoutSec, signal) {
  const r = await fetch(SIG_BASE + '/recv?id=' + peerId + '&timeout=' + timeoutSec,
                        signal ? {signal} : undefined);
  if (r.status === 204) return null;
  if (!r.ok) throw new Error('recv HTTP ' + r.status);
  return await r.json();
}

async function sigLeave() {
  if (peerId < 0) return;
  try { await fetch(SIG_BASE + '/leave?id=' + peerId, {method: 'POST'}); } catch (_) {}
  peerId = -1;
}

// --- Long-poll loop ---

async function pollLoop() {
  while (polling) {
    try {
      pollAbort = new AbortController();
      const msg = await sigRecv(2, pollAbort.signal);
      if (msg) await handleSignaling(msg);
    } catch (e) {
      if (e.name === 'AbortError') return;
      log('err', 'Poll error: ' + e.message);
      await new Promise(r => setTimeout(r, 500));
    }
  }
}

async function handleSignaling(msg) {
  if (!pc) return;
  if (msg.type === 'answer') {
    log('info', 'Got answer (' + msg.sdp.length + ' bytes)');
    await pc.setRemoteDescription({type: 'answer', sdp: msg.sdp});
  } else if (msg.type === 'candidate' && msg.candidate) {
    try {
      await pc.addIceCandidate({candidate: msg.candidate, sdpMid: '0', sdpMLineIndex: 0});
    } catch (e) {
      log('err', 'addIceCandidate: ' + e.message);
    }
  }
}

// --- WebRTC ---

async function start() {
  document.getElementById('btnConnect').disabled = true;
  document.getElementById('btnStop').disabled = false;
  setStatus('', 'Joining signaling...');

  // Consume the click's user activation now, before any await, so the
  // later autoplay on srcObject assignment (seconds later, after DTLS)
  // is permitted by the browser's autoplay policy.
  const _v0 = document.getElementById('remoteVideo');
  if (!_v0.srcObject) _v0.srcObject = new MediaStream();
  _v0.play().catch(() => {});

  try {
    peerId = await sigJoin();
    log('ok', 'Joined as peer ' + peerId);
  } catch (e) {
    log('err', 'Join failed: ' + e.message);
    setStatus('err', 'Join failed');
    document.getElementById('btnConnect').disabled = false;
    document.getElementById('btnStop').disabled = true;
    return;
  }

  // STUN-only — direct host candidates over LAN / Tailscale, no TURN.
  const iceServers = [
    {urls: 'stun:stun.l.google.com:19302'},
    {urls: 'stun:stun.cloudflare.com:3478'},
  ];
  pc = new RTCPeerConnection({iceServers});

  pc.oniceconnectionstatechange = () => {
    log('info', 'ICE: ' + pc.iceConnectionState);
    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      setStatus('ok', 'Connected');
      startStats();
    } else if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
      setStatus('err', pc.iceConnectionState === 'failed' ? 'ICE failed' : 'Disconnected');
      log('info', 'Reconnecting in 3s...');
      setTimeout(() => { stop(); start(); }, 3000);
    }
  };

  pc.ontrack = (e) => {
    log('ok', 'Remote track received: ' + e.track.kind);
    const video = document.getElementById('remoteVideo');
    if (e.streams && e.streams[0]) {
      if (video.srcObject && video.srcObject !== e.streams[0]) {
        e.streams[0].getTracks().forEach(t => {
          if (!video.srcObject.getTracks().some(x => x.id === t.id)) video.srcObject.addTrack(t);
        });
      } else {
        video.srcObject = e.streams[0];
      }
    } else {
      if (!video.srcObject) video.srcObject = new MediaStream();
      video.srcObject.addTrack(e.track);
    }
    video.play().catch(err => log('warn', 'Autoplay: ' + err.message));
  };

  pc.onicecandidate = async (e) => {
    if (e.candidate) {
      const c = e.candidate.candidate;
      // Skip mDNS ".local" host candidates — useless cross-machine; the
      // connection completes via the host's 100.x candidate + prflx.
      if (c.includes('.local')) {
        log('info', 'Skipping mDNS candidate');
        return;
      }
      await sigSend({type: 'candidate', candidate: c});
    } else {
      await sigSend({type: 'candidate', candidate: ''});
    }
  };

  // Single recvonly video transceiver (mid 0) — matches the host's one
  // send-only video track.
  pc.addTransceiver('video', {direction: 'recvonly'});
  log('info', 'Added recvonly video transceiver');

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Surface the H.265 feasibility check up front.
  if (/H265|HEVC/i.test(pc.localDescription.sdp)) {
    log('ok', 'Browser offers HEVC — H.265 receive supported');
  } else {
    log('warn', 'Browser offer has NO HEVC line. H.265 will not display. '
              + 'Use Safari or Chrome >=136, or run the host with -e h264_nvenc.');
  }

  log('info', 'Sending offer (' + pc.localDescription.sdp.length + ' bytes)');
  await sigSend({type: 'offer', sdp: pc.localDescription.sdp});
  setStatus('', 'Offer sent, waiting for answer...');

  polling = true;
  pollLoop();
}

// --- Live video parameters (RTCPeerConnection.getStats) ---

let statsTimer = null;
let _lastBytes = 0, _lastTs = 0, _lastRecv = 0, _lastLost = 0;

function startStats() {
  stopStats();
  _lastBytes = _lastTs = _lastRecv = _lastLost = 0;
  statsTimer = setInterval(updateStats, 1000);
}

function stopStats() {
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
  const el = document.getElementById('stats');
  el.style.display = 'none';
  el.innerHTML = '';
}

async function updateStats() {
  if (!pc) return;
  let inbound = null, cand = null;
  const codecs = {};
  const reports = await pc.getStats();
  reports.forEach(r => {
    if (r.type === 'codec') codecs[r.id] = r;
    if (r.type === 'inbound-rtp' && r.kind === 'video') inbound = r;
    if (r.type === 'candidate-pair' && (r.nominated || r.state === 'succeeded')) {
      if (!cand || (r.bytesReceived || 0) > (cand.bytesReceived || 0)) cand = r;
    }
  });
  if (!inbound) return;

  const now = inbound.timestamp;
  let kbps = 0;
  if (_lastTs && now > _lastTs)
    kbps = Math.round((inbound.bytesReceived - _lastBytes) * 8 / (now - _lastTs)); // *8/ms == kbps
  const dRecv = (inbound.packetsReceived || 0) - _lastRecv;
  const dLost = (inbound.packetsLost || 0) - _lastLost;
  const lossPct = (dRecv + dLost > 0) ? (dLost / (dRecv + dLost) * 100) : 0;
  _lastBytes = inbound.bytesReceived; _lastTs = now;
  _lastRecv = inbound.packetsReceived || 0; _lastLost = inbound.packetsLost || 0;

  const codec = inbound.codecId && codecs[inbound.codecId]
    ? codecs[inbound.codecId].mimeType.replace('video/', '') : '?';
  const res = (inbound.frameWidth && inbound.frameHeight)
    ? inbound.frameWidth + '×' + inbound.frameHeight : '—';
  const fps = inbound.framesPerSecond != null ? inbound.framesPerSecond : '—';
  const rtt = (cand && cand.currentRoundTripTime != null)
    ? Math.round(cand.currentRoundTripTime * 1000) : '—';
  const jitter = inbound.jitter != null ? Math.round(inbound.jitter * 1000) : '—';
  const cls = (v, warn, bad) => v >= bad ? ' class="v bad"' : v >= warn ? ' class="v warn"' : ' class="v"';

  const rows = [
    ['codec', codec],
    ['resolution', res],
    ['fps', fps],
    ['<b>bitrate</b>', '<b>' + kbps + ' kbps</b>'],
    ['packets', (inbound.packetsReceived || 0).toLocaleString()],
    ['loss', '<span' + cls(lossPct, 0.5, 3) + '>' + (inbound.packetsLost || 0)
             + ' (' + lossPct.toFixed(1) + '%)</span>'],
    ['jitter', '<span' + cls(jitter, 30, 80) + '>' + jitter + ' ms</span>'],
    ['rtt', rtt + ' ms'],
    ['nack / pli', (inbound.nackCount || 0) + ' / ' + (inbound.pliCount || 0)],
    ['frames dec', (inbound.framesDecoded || 0).toLocaleString()],
    ['key frames', inbound.keyFramesDecoded || 0],
    ['decoder', inbound.decoderImplementation || '—'],
  ];
  const el = document.getElementById('stats');
  el.innerHTML = rows.map(([k, v]) =>
    '<span class="k">' + k + '</span><span class="v">' + v + '</span>').join('');
  el.style.display = 'grid';
}

function stop() {
  document.getElementById('btnConnect').disabled = false;
  document.getElementById('btnStop').disabled = true;
  stopStats();

  polling = false;
  if (pollAbort) { pollAbort.abort(); pollAbort = null; }
  if (pc) { try { pc.close(); } catch(_) {} pc = null; }
  sigLeave();

  const video = document.getElementById('remoteVideo');
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  setStatus('', 'Stopped');
  log('info', 'Stopped');
}

window.addEventListener('beforeunload', () => {
  polling = false;
  if (pollAbort) pollAbort.abort();
  if (peerId >= 0) navigator.sendBeacon(SIG_BASE + '/leave?id=' + peerId);
});
</script>
</body>
</html>
