# Local coturn for nanortc relay-only interop tests.
#
# Start: ./scripts/start-test-turn.sh
# Stop : ./scripts/stop-test-turn.sh
#
# After start, run:
#   ctest --test-dir build-interop -L turn-relay --output-on-failure
#
# Uses host networking so coturn's relay socket binds on the host's actual
# interfaces. This is what makes the relay path reachable for the
# nanortc-as-TURN-client direction: clients route to coturn via a real
# (non-loopback) host IP, coturn's observed peer source then matches one of
# libdatachannel's gathered host candidates, and CreatePermission succeeds.
#
# Custom-bridge networks were attempted and rejected — OrbStack assigns the
# network address (host bits = 0) to its host-side bridge interface, which
# the kernel refuses to use as a source IP. Falling back to host networking
# matches the original Phase 5.2 setup and works cleanly on both OrbStack
# and Linux CI runners.

services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: nanortc-test-coturn
    network_mode: host
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
