# Local coturn for nanortc relay-only interop tests.
#
# Start: ./scripts/start-test-turn.sh
# Stop : ./scripts/stop-test-turn.sh
#
# After start, run:
#   ctest --test-dir build-interop -R '^interop_turn_relay$' --output-on-failure
#
# Uses host networking so the deterministic loopback relay is reachable from
# host-side tests. This profile covers the libdatachannel-as-TURN-client smoke
# direction. The nanortc-as-TURN-client strict relay-to-relay path needs a
# non-loopback external relay and runs in the protected external workflow.

services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: nanortc-test-coturn
    network_mode: host
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
