name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.combo.name }} / ${{ matrix.crypto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { name: DATA,       dc: ON,  audio: OFF, video: OFF, h265: OFF }
          - { name: AUDIO,      dc: ON,  audio: ON,  video: OFF, h265: OFF }
          - { name: MEDIA,      dc: ON,  audio: ON,  video: ON,  h265: OFF }
          - { name: MEDIA_H265, dc: ON,  audio: ON,  video: ON,  h265: ON  }
          - { name: AUDIO_ONLY, dc: OFF, audio: ON,  video: OFF, h265: OFF }
          - { name: MEDIA_ONLY, dc: OFF, audio: ON,  video: ON,  h265: OFF }
          - { name: CORE_ONLY,  dc: OFF, audio: OFF, video: OFF, h265: OFF }
        crypto: [mbedtls, openssl]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmbedtls-dev libssl-dev

      - name: Configure
        run: |
          cmake -B build \
            -DNANORTC_FEATURE_DATACHANNEL=${{ matrix.combo.dc }} \
            -DNANORTC_FEATURE_AUDIO=${{ matrix.combo.audio }} \
            -DNANORTC_FEATURE_VIDEO=${{ matrix.combo.video }} \
            -DNANORTC_FEATURE_H265=${{ matrix.combo.h265 }} \
            -DNANORTC_CRYPTO=${{ matrix.crypto }} \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  advanced-features:
    name: Advanced Features (${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: REORDER_NACK_FEC_RATE_CONTROL
            cmake_args: >-
              -DNANORTC_FEATURE_VIDEO_REORDER=ON
              -DNANORTC_FEATURE_VIDEO_NACK_RX=ON
              -DNANORTC_FEATURE_VIDEO_FEC=ON
              -DNANORTC_FEATURE_VIDEO_RATE_CONTROL=ON
              -DNANORTC_FEC_ADAPTIVE=ON
          - name: FEC_WITHOUT_NACK
            cmake_args: >-
              -DNANORTC_FEATURE_H265=ON
              -DNANORTC_FEATURE_VIDEO_REORDER=ON
              -DNANORTC_FEATURE_VIDEO_FEC=ON
              -DNANORTC_FEATURE_VIDEO_NACK_RX=OFF
              -DNANORTC_FEC_ADAPTIVE=ON
              -DNANORTC_FEATURE_VIDEO_PACING=ON
              -DNANORTC_FEATURE_VIDEO_AUTO_PLI=OFF
          - name: PACING_OFF
            cmake_args: >-
              -DNANORTC_FEATURE_H265=ON
              -DNANORTC_FEATURE_VIDEO_REORDER=ON
              -DNANORTC_FEATURE_VIDEO_NACK_RX=ON
              -DNANORTC_FEATURE_VIDEO_FEC=ON
              -DNANORTC_FEATURE_VIDEO_PACING=OFF
              -DNANORTC_FEATURE_VIDEO_AUTO_PLI=ON
              -DNANORTC_FEC_ADAPTIVE=OFF
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmbedtls-dev

      - name: Configure
        run: |
          cmake -B build \
            -DNANORTC_FEATURE_DATACHANNEL=ON \
            -DNANORTC_FEATURE_AUDIO=ON \
            -DNANORTC_FEATURE_VIDEO=ON \
            ${{ matrix.profile.cmake_args }} \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  constraints:
    name: Architecture Constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmbedtls-dev

      - name: "Check: no platform headers in src/"
        run: |
          ! grep -rn '#include <sys/' src/
          ! grep -rn '#include <pthread' src/
          ! grep -rn '#include <time\.h>' src/
          ! grep -rn '#include <unistd' src/
          ! grep -rn '#include <stdlib\.h>' src/

      - name: "Check: no dynamic allocation in src/"
        run: |
          ! grep -rn '\bmalloc\b' src/
          ! grep -rn '\bcalloc\b' src/
          ! grep -rn '\brealloc\b' src/

      - name: "Check: no unbounded string functions in src/+crypto/"
        run: |
          BANNED='strlen|sprintf|snprintf|strcpy|strncpy|strcat|strncat|sscanf|atoi|atol|gets'
          ! grep -rnE "\b($BANNED)\b" src/ crypto/ | grep -v "NANORTC_SAFE"

      - name: "Check: no hardcoded array sizes in struct headers"
        run: |
          ! grep -rnE '\b(uint8_t|char|int8_t|uint16_t|uint32_t)\s+\w+\[\s*[0-9]+\s*\];' src/*.h include/nanortc.h | grep -v '//'

      - name: "Check: code formatting"
        run: |
          pip install clang-format==22.1.2
          clang-format --dry-run --Werror src/*.c src/*.h include/*.h crypto/*.h crypto/*.c

      - name: "Check: invalid crypto backend is rejected"
        run: |
          if cmake -B build-invalid-crypto -DNANORTC_CRYPTO=invalid -DNANORTC_BUILD_TESTS=OFF; then
            echo "Invalid NANORTC_CRYPTO unexpectedly configured"
            exit 1
          fi

      - name: "Check: TX slot count validation and minimum profile"
        run: |
          if cmake -B build-invalid-tx-slots -DNANORTC_TX_SLOT_COUNT=3 -DNANORTC_BUILD_TESTS=OFF; then
            echo "Invalid NANORTC_TX_SLOT_COUNT unexpectedly configured"
            exit 1
          fi
          cmake -B build-tx-slot-one \
            -DNANORTC_TX_SLOT_COUNT=1 \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tx-slot-one -j$(nproc)
          ctest --test-dir build-tx-slot-one --output-on-failure

      - name: "Check: IDF_PATH alone remains a host build"
        run: |
          IDF_PATH=/nonexistent cmake -B build-host-boundary \
            -DNANORTC_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: "Check: symbol naming"
        run: |
          cmake -B build -DNANORTC_FEATURE_DATACHANNEL=ON -DNANORTC_FEATURE_AUDIO=ON -DNANORTC_FEATURE_VIDEO=ON -DNANORTC_FEATURE_H265=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j$(nproc)
          # All symbols must start with nano_/nanortc_ (public API) or a known module prefix (internal)
          ALLOWED='nano_|nanortc_|stun_|ice_|dtls_|nsctp_|sctp_|dc_|sdp_|rtp_|rtcp_|srtp_|jitter_|bwe_|twcc_|rate_window_|rate_control_|h264_|h265_|media_|ssrc_map_|addr_|track_|turn_'
          violations=$(nm -g build/libnanortc.a 2>/dev/null | grep ' T ' | awk '{print $3}' | grep -v '^_' | grep -vE "^($ALLOWED)" || true)
          if [ -n "$violations" ]; then
            echo "Symbols with unknown prefix (expected nano_ or module prefix):"
            echo "$violations"
            exit 1
          fi

      - name: "Check: no global mutable state"
        run: |
          # B = uninitialized data, D = initialized data (both are mutable globals)
          violations=$(nm build/libnanortc.a 2>/dev/null | grep ' [BD] ' | grep -v '__' | grep -v 'crc32c_table' || true)
          if [ -n "$violations" ]; then
            echo "Global mutable state found:"
            echo "$violations"
            exit 1
          fi

      - name: "Check: DC-OFF has no SCTP symbols"
        run: |
          cmake -B build-nodc -DNANORTC_FEATURE_DATACHANNEL=OFF -DNANORTC_FEATURE_AUDIO=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-nodc -j$(nproc)
          violations=$(nm build-nodc/libnanortc.a 2>/dev/null | grep ' T ' | grep 'nsctp_' || true)
          if [ -n "$violations" ]; then
            echo "SCTP symbols found in DC-OFF build:"
            echo "$violations"
            exit 1
          fi

  sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmbedtls-dev

      - name: Configure (all advanced media + H265 + ASan)
        run: >-
          cmake -B build
          -DNANORTC_FEATURE_DATACHANNEL=ON
          -DNANORTC_FEATURE_AUDIO=ON
          -DNANORTC_FEATURE_VIDEO=ON
          -DNANORTC_FEATURE_H265=ON
          -DNANORTC_FEATURE_VIDEO_RATE_CONTROL=ON
          -DNANORTC_FEATURE_VIDEO_REORDER=ON
          -DNANORTC_FEATURE_VIDEO_NACK_RX=ON
          -DNANORTC_FEATURE_VIDEO_FEC=ON
          -DNANORTC_FEATURE_VIDEO_PACING=ON
          -DNANORTC_FEATURE_VIDEO_AUTO_PLI=ON
          -DNANORTC_FEC_ADAPTIVE=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DADDRESS_SANITIZER=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmbedtls-dev clang

      - name: Configure (Fuzz + MEDIA)
        run: |
          CC=clang cmake -B build \
            -DNANORTC_BUILD_FUZZ=ON \
            -DNANORTC_BUILD_TESTS=OFF \
            -DNANORTC_FEATURE_DATACHANNEL=ON \
            -DNANORTC_FEATURE_AUDIO=ON \
            -DNANORTC_FEATURE_VIDEO=ON \
            -DNANORTC_FEATURE_H265=ON \
            -DNANORTC_FEATURE_VIDEO_RATE_CONTROL=ON \
            -DNANORTC_FEATURE_VIDEO_REORDER=ON \
            -DNANORTC_FEATURE_VIDEO_NACK_RX=ON \
            -DNANORTC_FEATURE_VIDEO_FEC=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Fuzz (30s per harness)
        run: |
          mkdir -p tests/fuzz/corpus build/fuzz-logs
          mapfile -t fuzzers < <(find build/tests/fuzz -maxdepth 1 -type f -executable -name 'fuzz_*' | sort)
          if [ "${#fuzzers[@]}" -eq 0 ]; then
            echo "No fuzz harnesses were built"
            exit 1
          fi
          failed=0
          for binary in "${fuzzers[@]}"; do
            t=$(basename "$binary")
            corpus="tests/fuzz/corpus/${t#fuzz_}"
            log="build/fuzz-logs/$t.log"
            mkdir -p "$corpus"
            echo "=== $t ==="
            if "$binary" "$corpus" \
              -max_total_time=30 -max_len=4096 -print_final_stats=1 \
              -artifact_prefix="build/fuzz-logs/$t-" >"$log" 2>&1; then
              tail -5 "$log"
            else
              cat "$log"
              failed=1
            fi
          done
          exit "$failed"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmbedtls-dev lcov

      - name: Configure (Coverage + MEDIA)
        run: |
          cmake -B build \
            -DNANORTC_COVERAGE=ON \
            -DNANORTC_FEATURE_DATACHANNEL=ON \
            -DNANORTC_FEATURE_AUDIO=ON \
            -DNANORTC_FEATURE_VIDEO=ON \
            -DNANORTC_FEATURE_H265=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Capture coverage
        run: |
          lcov --capture --directory build --output-file coverage-raw.info \
            --ignore-errors inconsistent,inconsistent --quiet
          lcov --extract coverage-raw.info '*/src/*.c' '*/crypto/*.c' \
            --output-file coverage.info --ignore-errors unused,unused --quiet
          lcov --summary coverage.info 2>&1 | tee coverage-summary.txt
          # Coverage threshold (line coverage). Tracks the measured baseline
          # rather than an aspirational target — recent feature work (TURN
          # relay client + H.265 SDP fmtp) added code faster than tests, so
          # the gate sits at the current floor with the expectation that it
          # is re-tightened as new tests land.
          LINE_COV=$(grep "lines" coverage-summary.txt | grep -oE '[0-9]+\.[0-9]+' | head -1)
          LINE_INT=${LINE_COV%.*}
          THRESHOLD=79
          echo "Line coverage: ${LINE_COV}% (threshold: ${THRESHOLD}%)"
          if [ "$LINE_INT" -lt "$THRESHOLD" ]; then
            echo "FAIL: coverage ${LINE_COV}% < ${THRESHOLD}%"
            exit 1
          fi

  interop:
    name: Interop (libdatachannel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - name: Configure
        run: |
          cmake -B build \
            -DNANORTC_BUILD_INTEROP_TESTS=ON \
            -DNANORTC_CRYPTO=openssl \
            -DNANORTC_FEATURE_AUDIO=ON \
            -DNANORTC_FEATURE_VIDEO=ON \
            -DNANORTC_FEATURE_H265=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Assert A/V interop tests are registered
        run: |
          tests=$(ctest --test-dir build -N)
          echo "$tests"
          grep -q 'interop_audio' <<<"$tests"
          grep -q 'interop_video' <<<"$tests"

      - name: Test
        run: ctest --test-dir build -R interop -LE network --output-on-failure

  interop-turn-relay:
    name: Interop TURN Relay (nanortc client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - name: Start coturn
        run: ./scripts/start-test-turn.sh

      - name: Configure
        run: |
          cmake -B build-interop \
            -DNANORTC_BUILD_INTEROP_TESTS=ON \
            -DNANORTC_CRYPTO=openssl \
            -DNANORTC_FEATURE_AUDIO=ON \
            -DNANORTC_FEATURE_VIDEO=ON \
            -DNANORTC_FEATURE_H265=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-interop -j$(nproc)

      - name: Test (nanortc-as-TURN-client relay path)
        run: ctest --test-dir build-interop -L turn-relay --output-on-failure

      - name: Stop coturn
        if: always()
        run: ./scripts/stop-test-turn.sh
